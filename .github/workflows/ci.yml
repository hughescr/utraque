name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target: the launchd socket-activation path is
        # darwin-only and needs cgo. Linux proves the plain-listen fallback
        # stays portable.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Validate Go
        run: ./scripts/validate.sh go

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell
        run: ./scripts/validate.sh shell

      - name: Test pre-push hook
        run: ./scripts/validate.sh hooks
